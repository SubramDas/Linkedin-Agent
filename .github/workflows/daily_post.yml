name: Daily LinkedIn Assistant

on:
  schedule:
    # 21:30 UTC = 3:00 AM IST
    # 22:30 UTC = 4:00 AM IST
    # 23:30 UTC = 5:00 AM IST
    - cron: '30 21,22,23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  run-assistant:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit state & drafts back to repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LinkedIn Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS || 'gemini-3-flash-preview,gemini-3.5-flash,gemini-3.5-flash-lite' }}
          GEMINI_CALL_DELAY_SECONDS: "30.0"
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          WEB_REVIEW_URL: ${{ secrets.WEB_REVIEW_URL }}
        run: python main.py

      - name: Commit & push updated drafts & state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/ state/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily draft & state [skip ci]" && git push)
